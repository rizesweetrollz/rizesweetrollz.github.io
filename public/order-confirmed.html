<!DOCTYPE html>
<html lang="en">
    <head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Order Confirmed — Rize Sweet Rollz</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="icon" type="image/x-icon" href="favicon.ico">
    	<script src="every-page.js"></script>
    </head>
    <body>

	<nav id="title-bar"></nav>

	<section class="thanks-section">
	    <div class="thanks-inner">
		<div class="thanks-mark">&check;</div>
		<h1>Thank You — Your Order Is In</h1>
		<p class="thanks-sub">We've received your payment and your pickup details. You'll get a receipt by email, and we'll be in touch to confirm your time.</p>

		<div class="thanks-ref" id="refBox" style="display:none;">
		    <div class="thanks-ref-label">Your order reference</div>
		    <div class="thanks-ref-code" id="refCode"></div>
		</div>

		<p class="thanks-contact">
		    Questions about this order? Call us at <strong id="phoneOut"></strong>
		    or email <a href="#" id="emailOut"></a>.
		</p>

		<a class="btn-primary thanks-btn" href="index.html">Back to Home</a>
	    </div>
	</section>

	<footer>© 2026 Rize Sweet Rollz — All rights reserved</footer>

	<script src="js/config.js"></script>
	<script>
	// Square sends the customer back here with ?ref=RSR-... appended.
	      const ref = new URLSearchParams(location.search).get('ref');
	      if (ref) {
		  document.getElementById('refCode').textContent = ref;
		  document.getElementById('refBox').style.display = 'block';
	      }
	      document.getElementById('phoneOut').textContent = BUSINESS_PHONE;
	      const mail = document.getElementById('emailOut');
	      mail.textContent = BUSINESS_EMAIL;
	      mail.href = 'mailto:' + BUSINESS_EMAIL;
	</script>
    </body>
</html>
